<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة النظام</title>
  <meta name="theme-color" content="#3498db">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary:#3498db; --secondary:#2ecc71; --dark:#2c3e50; --gray:#95a5a6; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Tahoma','Geneva','Verdana',sans-serif; }
    body { background: linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%); color:#333; min-height:100vh; padding:20px; }
    .container { max-width: 900px; margin:0 auto; }
    header { background:white; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 5px 15px rgba(0,0,0,0.1); border-bottom:5px solid var(--primary); text-align:center; }
    h1 { color:var(--dark); font-size:1.8rem; margin-bottom:8px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .card { background:white; border-radius:12px; padding:20px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
    .card h2 { color:var(--dark); font-size:1.2rem; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    .btn { display:inline-block; background:var(--primary); color:white; border:none; padding:10px 18px; border-radius:8px; font-size:0.95rem; cursor:pointer; transition:all 0.3s ease; font-weight:bold; margin:5px 0; }
    .btn:hover { background:#2980b9; transform:translateY(-2px); box-shadow:0 7px 14px rgba(50,50,93,0.1),0 3px 6px rgba(0,0,0,0.08); }
    .input-group { margin-top:10px; }
    label { display:block; margin-bottom:6px; font-weight:bold; color:var(--dark); }
    input, textarea { width:100%; padding:10px 12px; border:2px solid #ddd; border-radius:8px; font-size:1rem; transition:border 0.3s; }
    input:focus, textarea:focus { border-color:var(--primary); outline:none; }
    .status { padding:10px; border-radius:8px; background:#f7f9fc; border-right:4px solid var(--primary); margin-top:12px; }
    .note { color:var(--gray); font-size:0.9rem; margin-top:8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-link"></i> بوابة الربط بين المريض ومقدم الرعاية</h1>
      <p>اختر دورك أو أدخل رمز جهاز المريض لفتح لوحة مقدم الرعاية</p>
    </header>
    <div class="grid">
      <div class="card">
        <h2><i class="fas fa-user"></i> أنا المريض</h2>
        <p class="note">افتح تطبيق المريض لإدارة الأدوية والتقويم الصحي</p>
        <button class="btn" id="open-patient"><i class="fas fa-pills"></i> فتح تطبيق المريض</button>
        <div class="input-group">
          <label>نسخ رمز جهاز المريض من التطبيق</label>
          <button class="btn" id="open-patient-copy"><i class="fas fa-copy"></i> فتح التطبيق لنسخ الرمز</button>
        </div>
      </div>
      <div class="card">
        <h2><i class="fas fa-user-nurse"></i> أنا مقدم الرعاية</h2>
        <p class="note">ألصق رمز جهاز المريض (FCM) أو استخدم رابط المشاركة</p>
        <div class="input-group">
          <label for="patient-token-input">رمز جهاز المريض (FCM)</label>
          <input type="text" id="patient-token-input" placeholder="ألصق الرمز هنا">
        </div>
        <button class="btn" id="save-and-open-caregiver"><i class="fas fa-door-open"></i> حفظ وفتح لوحة مقدم الرعاية</button>
        <div class="input-group">
          <label>رابط مشاركة سريع</label>
          <input type="text" id="share-link" readonly placeholder="سيظهر رابط المشاركة هنا">
          <button class="btn" id="copy-share-link"><i class="fas fa-share"></i> نسخ رابط المشاركة</button>
        </div>
        <div class="status" id="status-line">جاهز</div>
      </div>
    </div>
  </div>
  <script>
    const patientBtn = document.getElementById('open-patient');
    const patientCopyBtn = document.getElementById('open-patient-copy');
    const tokenInput = document.getElementById('patient-token-input');
    const saveOpenBtn = document.getElementById('save-and-open-caregiver');
    const shareLinkInput = document.getElementById('share-link');
    const copyShareBtn = document.getElementById('copy-share-link');
    const statusEl = document.getElementById('status-line');
    patientBtn.addEventListener('click', function() {
      window.location.href = 'index.html';
    });
    patientCopyBtn.addEventListener('click', function() {
      window.location.href = 'index.html';
    });
    function saveTokenToCaregiverPanel(token) {
      try {
        const careData = JSON.parse(localStorage.getItem('caregiverPanel')) || {};
        careData.patientToken = token;
        localStorage.setItem('caregiverPanel', JSON.stringify(careData));
        statusEl.textContent = 'تم حفظ رمز جهاز المريض';
      } catch (e) {
        statusEl.textContent = 'تعذر حفظ الرمز';
      }
    }
    function buildShareLink(token) {
      const url = new URL(window.location.origin + '/caregiver.html');
      url.searchParams.set('token', token);
      return url.toString();
    }
    saveOpenBtn.addEventListener('click', function() {
      const token = tokenInput.value.trim();
      if (!token) { statusEl.textContent = 'ضع رمز الجهاز أولاً'; return; }
      saveTokenToCaregiverPanel(token);
      const link = buildShareLink(token);
      shareLinkInput.value = link;
      window.location.href = link;
    });
    copyShareBtn.addEventListener('click', function() {
      const val = shareLinkInput.value.trim();
      if (!val) { statusEl.textContent = 'لا يوجد رابط للمشاركة'; return; }
      navigator.clipboard.writeText(val).then(() => { statusEl.textContent = 'تم نسخ رابط المشاركة'; });
    });
  </script>
</body>
</html>
