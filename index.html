<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الأدوية المتشارك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- إضافة مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    
    <!-- إضافة مكتبة Noty للإشعارات الجميلة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.min.js"></script>
    
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --warning: #e74c3c;
            --danger: #c0392b;
            --light: #f8f9fa;
            --dark: #2c3e50;
            --gray: #95a5a6;
            --purple: #9b59b6;
            --orange: #e67e22;
            --notification: #ff9800;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            border-bottom: 5px solid var(--primary);
        }
        
        h1 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        
        h2 {
            color: var(--primary);
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        h3 {
            color: var(--dark);
            margin: 20px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .info-card {
            background: var(--light);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 992px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        
        .medication-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .time-slot {
            margin-bottom: 30px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border-right: 5px solid var(--primary);
            position: relative;
        }
        
        .time-slot.upcoming {
            border-right: 5px solid var(--notification);
            background: #fff8e1;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
        
        .time-title {
            display: flex;
            align-items: center;
            color: var(--dark);
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }
        
        .time-title i {
            margin-left: 10px;
            color: var(--primary);
        }
        
        .medication-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin: 10px 0;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }
        
        .medication-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .medication-info {
            flex-grow: 1;
        }
        
        .med-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--dark);
        }
        
        .med-dosage {
            color: var(--primary);
            font-size: 0.95rem;
            margin-top: 5px;
        }
        
        .med-notes {
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 5px;
            font-style: italic;
        }
        
        .checkbox-container {
            position: relative;
            margin-right: 10px;
            min-width: 60px;
        }
        
        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }
        
        .checkmark {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            width: 40px;
            background-color: #f1f1f1;
            border-radius: 8px;
            font-size: 20px;
            color: transparent;
            transition: all 0.3s ease;
            border: 2px solid #ddd;
            cursor: pointer;
        }
        
        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }
        
        .checkbox-container input:checked ~ .checkmark:after {
            content: "✓";
        }
        
        .status-taken {
            background-color: rgba(46, 204, 113, 0.1) !important;
            border-color: rgba(46, 204, 113, 0.3) !important;
        }
        
        .status-missed {
            background-color: rgba(231, 76, 60, 0.1) !important;
            border-color: rgba(231, 76, 60, 0.3) !important;
        }
        
        .critical-med {
            background-color: rgba(231, 76, 60, 0.05) !important;
            border-right: 3px solid var(--danger) !important;
        }
        
        .warning-box {
            background: #fff3e0;
            border-right: 4px solid #ff9800;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .danger-box {
            background: #ffebee;
            border-right: 4px solid #f44336;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .notification-box {
            background: #e3f2fd;
            border-right: 4px solid #2196f3;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--dark);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-align: center;
            margin: 5px;
        }
        
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }
        
        .btn-success {
            background: var(--secondary);
        }
        
        .btn-success:hover {
            background: #27ae60;
        }
        
        .btn-warning {
            background: var(--warning);
        }
        
        .btn-warning:hover {
            background: #c0392b;
        }
        
        .btn-notification {
            background: var(--notification);
        }
        
        .btn-notification:hover {
            background: #f57c00;
        }
        
        .progress-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .progress-bar {
            height: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #27ae60);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        
        .share-link {
            background: #e8f4fc;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .share-link.active {
            display: block;
        }
        
        .history-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #f1f1f1;
            align-items: center;
        }
        
        .history-time {
            color: var(--gray);
            font-size: 0.9rem;
            min-width: 70px;
        }
        
        .history-med {
            font-weight: bold;
            flex-grow: 1;
            margin: 0 10px;
        }
        
        .history-status {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            min-width: 70px;
            text-align: center;
        }
        
        .status-taken-badge {
            background: rgba(46, 204, 113, 0.2);
            color: var(--secondary);
        }
        
        .status-missed-badge {
            background: rgba(231, 76, 60, 0.2);
            color: var(--warning);
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: flex;
            align-items: center;
        }
        
        .alert-warning {
            background: rgba(231, 76, 60, 0.1);
            color: #c0392b;
            border-right: 4px solid var(--warning);
        }
        
        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border-right: 4px solid var(--secondary);
        }
        
        .alert i {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        .instructions {
            color: var(--gray);
            font-size: 0.9rem;
            margin-top: 10px;
            line-height: 1.5;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            color: var(--gray);
            border-top: 1px solid #ddd;
            font-size: 0.9rem;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        
        .empty-history {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        
        .empty-history i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ddd;
        }
        
        .critical-info {
            background: rgba(231, 76, 60, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border-right: 4px solid var(--danger);
        }
        
        .med-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e3f2fd;
            border-radius: 8px;
            margin-left: 10px;
            color: var(--primary);
        }
        
        .time-checkboxes {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .time-checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        
        .time-checkbox-item input {
            width: auto;
            margin: 0;
        }
        
        .checkbox-label {
            margin: 0;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .repeated-meds {
            background: #f3e5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-right: 4px solid var(--purple);
        }
        
        /* تحسينات لـ Checkboxes */
        .checkmark:hover {
            background-color: #e0e0e0;
        }
        
        .checkbox-container input:focus ~ .checkmark {
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }
        
        .medication-item.checked {
            background-color: rgba(46, 204, 113, 0.05);
        }
        
        /* إضافة مؤشر الحفظ التلقائي */
        .save-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--secondary);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .save-indicator.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        
        /* إضافة مؤشر حالة Firebase */
        .firebase-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .firebase-status.online {
            border-right: 4px solid var(--secondary);
        }
        
        .firebase-status.offline {
            border-right: 4px solid var(--warning);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .status-dot.online {
            background-color: var(--secondary);
        }
        
        .status-dot.offline {
            background-color: var(--warning);
        }
        
        /* أنماط الإشعارات */
        .notification-badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: var(--notification);
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
